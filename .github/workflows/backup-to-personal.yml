name: Backup to Personal GitHub

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  backup:
    name: Backup all branches and tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Backup branches and tags
        env:
          PERSONAL_REPO_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Configuring work repository authentication..."

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/Mafhh-Technologies/Seaon.app.git"

          echo "Configuring personal repository..."

          git remote add personal "https://x-access-token:${PERSONAL_REPO_TOKEN}@github.com/shakerofficial7-design/SEAON_ERP_Dashboard.git"

          echo "Fetching all branches and tags from work repository..."

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

          echo "Backing up branches..."

          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -v '^HEAD$'); do
            echo "Backing up branch: $branch"
            git push personal "refs/remotes/origin/$branch:refs/heads/$branch"
          done

          echo "Backing up tags..."

          for tag in $(git for-each-ref --format='%(refname:strip=2)' refs/tags/); do
            echo "Backing up tag: $tag"
            git push personal "refs/tags/$tag:refs/tags/$tag"
          done

          echo "Backup completed successfully."
