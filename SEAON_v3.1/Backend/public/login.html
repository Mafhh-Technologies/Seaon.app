<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEAON ERP - Login</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/components.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-header">
                <img src="assets/images/logo.png" alt="SEAON ERP" class="auth-logo" />
                <h1>SEAON ERP</h1>
                <p>Manage your inventory with ease</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" title="Enter your email address">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@seaon.com" 
                        value="admin@seaon.com"
                        required 
                    />
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="••••••••" 
                            value="Admin@123"
                            required 
                        />
                        <button type="button" class="toggle-password" id="togglePassword" title="Show password" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" checked />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
                
                <div class="auth-error" id="loginError" hidden>
                    <i class="fas fa-exclamation-circle"></i>
                    Invalid credentials. Please try again.
                </div>
            </form>
            
            <div class="auth-footer">
                <p>Demo credentials: admin@seaon.com / Admin@123</p>
            </div>
        </div>
    </div>

    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <script>
document.addEventListener("DOMContentLoaded",()=>{
  if(Auth.isAuthenticated()){location.href="/app/index.html";return;}
  const form=document.getElementById("loginForm"), error=document.getElementById("loginError"), btn=document.getElementById("loginBtn");
  document.getElementById("togglePassword").addEventListener("click",()=>{
    const p=document.getElementById("password"), icon=document.querySelector("#togglePassword i");
    p.type=p.type==="password"?"text":"password"; icon.className=p.type==="password"?"fas fa-eye":"fas fa-eye-slash";
  });
  form.addEventListener("submit",async e=>{
    e.preventDefault(); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...'; error.hidden=true;
    try{await Auth.login(document.getElementById("email").value.trim(),document.getElementById("password").value); location.href="/app/index.html";}
    catch(err){error.textContent=err.message||"Login failed."; error.hidden=false; btn.disabled=false; btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Sign In';}
  });
});
</script>
</body>
</html>
