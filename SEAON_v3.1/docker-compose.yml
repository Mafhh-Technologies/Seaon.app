version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: seaon_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/seaon.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: seaon_frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data: