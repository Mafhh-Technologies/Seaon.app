<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InventoryPro - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-header">
                <img src="assets/images/logo.png" alt="InventoryPro" class="auth-logo" />
                <h1>InventoryPro</h1>
                <p>Manage your inventory with ease</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" title="Enter your email address">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@inventorypro.com" 
                        value="admin@inventorypro.com"
                        required 
                    />
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="••••••••" 
                            value="password123"
                            required 
                        />
                        <button type="button" class="toggle-password" id="togglePassword" title="Show password" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" checked />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
                
                <div class="auth-error" id="loginError" hidden>
                    <i class="fas fa-exclamation-circle"></i>
                    Invalid credentials. Please try again.
                </div>
            </form>
            
            <div class="auth-footer">
                <p>Demo credentials: admin@inventorypro.com / password123</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect to dashboard
            if (Auth.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            
            // Toggle password visibility
            document.getElementById('togglePassword').addEventListener('click', function() {
                const password = document.getElementById('password');
                const icon = this.querySelector('i');
                
                if (password.type === 'password') {
                    password.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    password.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
            
            // Handle login
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const errorEl = document.getElementById('loginError');
                const loginBtn = document.getElementById('loginBtn');
                
                // Show loading state
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                errorEl.style.display = 'none';
                
                try {
                    const user = await Auth.login(email, password);
                    
                    if (user) {
                        // Success - redirect to dashboard
                        window.location.href = 'index.html';
                    } else {
                        // Failed login
                        errorEl.style.display = 'block';
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    }
                } catch (error) {
                    errorEl.textContent = error.message || 'Login failed. Please try again.';
                    errorEl.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            });
        });
    </script>
</body>
</html>
